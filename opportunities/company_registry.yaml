# Extensible registry of employer job boards. Add a line to add a company - no code changes.
#
#   ats:             greenhouse | lever | ashby
#   board:           the board token / site name from the company's careers URL
#                    (boards.greenhouse.io/<board>, jobs.lever.co/<board>, jobs.ashbyhq.com/<board>)
#   company:         display name
#   employer_domains: domains owned by the employer (used when verifying official apply URLs)
#   region:          lever only: "eu" if the board lives on api.eu.lever.co
#
# IMPORTANT: entries are STARTING POINTS. Board tokens were not live-verified when this file was written.
# Run `python scripts/verify_sources.py` - any board that does not answer is reported and never shown to users.
sources:
