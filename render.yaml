# Render Blueprint. Deploy: Render dashboard -> New -> Blueprint -> select this repo.
# Secrets are NOT in this file: set them in the dashboard (sync: false).
databases:
  - name: careerpilot-db
    plan: free            # free Postgres expires after a period; use a paid plan for anything you want to keep
    databaseName: careerpilot
services:
  - type: web
    name: careerpilot-ai
    runtime: python
    plan: starter         # 512 MB is enough for the lightweight embedder; Sentence Transformers needs >= 2 GB
    buildCommand: pip install -r requirements.txt            # use requirements-ml.txt on a larger plan
    startCommand: alembic upgrade head && streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    healthCheckPath: /_stcore/health
    autoDeploy: false
    envVars:
      - {key: PYTHON_VERSION, value: "3.12.3"}
      - {key: APP_ENV, value: production}
      - key: DATABASE_URL
        fromDatabase: {name: careerpilot-db, property: connectionString}
      - {key: LLM_PROVIDER, value: openai_compatible}
      - {key: LLM_BASE_URL, sync: false}
      - {key: LLM_API_KEY, sync: false}
      - {key: LLM_MODEL, sync: false}
      - {key: HTTP_USER_AGENT, sync: false}
      - {key: ADZUNA_APP_ID, sync: false}
      - {key: ADZUNA_APP_KEY, sync: false}
      - {key: EMBEDDING_BACKEND, value: auto}
      - {key: VECTOR_BACKEND, value: memory}      # in-process numpy store; vectors are re-derived from the database on demand (see README: ChromaDB advisories)
  - type: cron
    name: careerpilot-refresh
    runtime: python
    plan: starter
    schedule: "0 */12 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/refresh_opportunities.py
    envVars:
      - {key: ADZUNA_APP_ID, sync: false}
      - {key: ADZUNA_APP_KEY, sync: false}
      - {key: PYTHON_VERSION, value: "3.12.3"}
      - {key: APP_ENV, value: production}
      - key: DATABASE_URL
        fromDatabase: {name: careerpilot-db, property: connectionString}
      - {key: HTTP_USER_AGENT, sync: false}
